<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Machine Sees You Smile</title>
<style>
  html,body{margin:0;height:100%;background:#05080c;color:#e8e8e8;font-family:"Courier New",monospace;overflow:hidden}
  #stage{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
  video,canvas{position:absolute;max-width:100%;max-height:100%;object-fit:contain;transform:scaleX(-1)}
  video{filter:grayscale(1) contrast(1.1) brightness(.8)}
  #hud{position:fixed;left:16px;right:16px;bottom:16px;letter-spacing:2px;text-transform:uppercase;font-size:14px;color:#ffd23f}
  #meter{position:fixed;top:16px;left:16px;font-size:13px;letter-spacing:2px}
  #start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#05080c;z-index:5}
  button{background:none;border:2px solid #ffd23f;color:#ffd23f;font:inherit;letter-spacing:3px;padding:14px 28px;cursor:pointer;text-transform:uppercase}
</style>
</head>
<body>
<div id="start"><button id="go">Show the Machine your face</button></div>
<div id="stage"><video id="v" autoplay muted playsinline></video><canvas id="o"></canvas></div>
<div id="meter"></div>
<div id="hud"></div>

<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.js"></script>
<script>
const MODELS = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model';
const v = document.getElementById('v'), o = document.getElementById('o');
const hud = document.getElementById('hud'), meter = document.getElementById('meter');
const ctx = o.getContext('2d');
const YELLOW = '#ffd23f', WHITE = '#e8e8e8';
const SMILE_THRESHOLD = 0.7;

let typeText = '', typeStart = 0, lastMsg = '';
function say(t){ if (t === lastMsg) return; lastMsg = t; typeText = t; typeStart = performance.now(); }
setInterval(() => {
  const n = Math.min(typeText.length, ((performance.now() - typeStart) / 50) | 0);
  hud.textContent = '> ' + typeText.slice(0, n) + (Math.floor(performance.now() / 400) % 2 ? '_' : ' ');
}, 60);

function bracket(x, y, w, h, l, color){
  ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.beginPath();
  ctx.moveTo(x, y + l); ctx.lineTo(x, y); ctx.lineTo(x + l, y);
  ctx.moveTo(x + w - l, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + l);
  ctx.moveTo(x + w, y + h - l); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w - l, y + h);
  ctx.moveTo(x + l, y + h); ctx.lineTo(x, y + h); ctx.lineTo(x, y + h - l);
  ctx.stroke();
}

// Optional chime when the smile registers
let audio;
function beep(){
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const osc = audio.createOscillator(), g = audio.createGain();
    osc.frequency.value = 880; g.gain.value = 0.05;
    osc.connect(g); g.connect(audio.destination);
    osc.start(); osc.stop(audio.currentTime + 0.12);
  } catch (e) {}
}

let smilingBefore = false, smileFrames = 0, smilesSeen = 0;

async function loop(){
  const opts = new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.5 });
  const res = await faceapi.detectAllFaces(v, opts).withFaceExpressions();
  o.width = v.videoWidth; o.height = v.videoHeight;
  ctx.clearRect(0, 0, o.width, o.height);

  if (!res.length){
    say('Scanning... no subject.'); meter.textContent = 'SUBJECTS: 0';
    smileFrames = 0; smilingBefore = false;
  } else {
    let anySmile = false;
    for (const r of res){
      const happy = r.expressions.happy;
      const smiling = happy > SMILE_THRESHOLD;
      anySmile = anySmile || smiling;
      const b = r.detection.box, pad = 20;
      bracket(b.x - pad, b.y - pad, b.width + pad * 2, b.height + pad * 2, 26, smiling ? YELLOW : WHITE);
    }
    meter.textContent = 'SUBJECTS: ' + res.length + '   SMILE: ' + Math.round(Math.max(...res.map(r => r.expressions.happy)) * 100) + '%';
    smileFrames = anySmile ? smileFrames + 1 : 0;
    const smiling = smileFrames >= 3;          // debounce a few frames
    if (smiling && !smilingBefore){ smilesSeen++; beep(); }
    smilingBefore = smiling;
    say(smiling ? (smilesSeen > 1 ? 'Smile detected again. Hello, Admin.' : 'Smile detected. Hello, Admin.')
                : 'Subject acquired. Awaiting expression.');
  }
  requestAnimationFrame(loop);
}

document.getElementById('go').onclick = async () => {
  document.getElementById('start').remove();
  say('Initializing...');
  try {
    await faceapi.nets.tinyFaceDetector.loadFromUri(MODELS);
    await faceapi.nets.faceExpressionNet.loadFromUri(MODELS);
    v.srcObject = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
    await v.play();
    loop();
  } catch (e) {
    say('Error: ' + (e.message || e) + ' (camera needs https or localhost)');
  }
};
</script>
</body>
</html>
