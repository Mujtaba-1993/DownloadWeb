name: Update KSA Coupons Data

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh coupons data
        run: python3 ksa-coupons/scripts/update_coupons.py

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- ksa-coupons/data/coupons.json ksa-coupons/index.html; then
            echo "No changes to commit."
            exit 0
          fi
          git add ksa-coupons/data/coupons.json ksa-coupons/index.html
          git commit -m "chore: auto-refresh KSA coupons data"
          git push
