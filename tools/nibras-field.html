<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8A5A2B">
<meta name="mobile-web-app-capable" content="yes">
<title>مقاسات النبراس — أداة الفني</title>
<style>
:root{
  --bronze:#8A5A2B; --bronze-l:#FBF3E8; --ink:#1E2427; --soft:#5A666E;
  --hair:#DCE1E4; --bg:#F4F6F7; --card:#FFFFFF;
  --ok:#1E7A45; --ok-l:#EAF5EF; --bad:#B3261E; --bad-l:#FBEDEC;
  --tap:52px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg); color:var(--ink); font-size:16px; line-height:1.6;
  padding-bottom:calc(88px + env(safe-area-inset-bottom));
}
body.ltr{direction:ltr}
.wrap{max-width:640px;margin:0 auto;padding:0 12px}

/* ===== الشريط العلوي ===== */
header{
  position:sticky;top:0;z-index:30;background:var(--bronze);color:#fff;
  padding:calc(10px + env(safe-area-inset-top)) 12px 10px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px}
header .sub{font-size:11.5px;opacity:.85;font-weight:400;display:block;margin-top:1px}
.lang{display:flex;background:rgba(255,255,255,.18);border-radius:999px;padding:3px;gap:2px}
.lang button{
  border:0;background:transparent;color:#fff;font-family:inherit;font-size:13px;font-weight:700;
  padding:5px 12px;border-radius:999px;cursor:pointer;min-width:44px;
}
.lang button[aria-pressed="true"]{background:#fff;color:var(--bronze)}

/* ===== البطاقات ===== */
.card{background:var(--card);border:1px solid var(--hair);border-radius:14px;padding:13px;margin:12px 0}
.eyebrow{font-size:12px;font-weight:700;color:var(--bronze);letter-spacing:.4px;margin:18px 2px 6px}
label.f{display:block;font-size:12.5px;color:var(--soft);font-weight:600;margin-bottom:4px}
input,select,textarea{
  width:100%;border:1px solid var(--hair);border-radius:10px;background:#fff;color:var(--ink);
  font-family:inherit;font-size:16px;padding:0 11px;height:var(--tap);
}
textarea{height:auto;min-height:74px;padding:10px 11px;line-height:1.7;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--bronze);outline-offset:-1px;border-color:var(--bronze)}
input[inputmode="numeric"]{font-variant-numeric:tabular-nums;text-align:center;font-size:19px;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.fld{margin-bottom:11px}
.fld:last-child{margin-bottom:0}

/* ===== أزرار الاختيار الكبيرة ===== */
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px}
.opt{
  border:1.5px solid var(--hair);background:#fff;border-radius:12px;padding:9px 6px;
  font-family:inherit;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:5px;min-height:74px;justify-content:center;
}
.opt svg{width:38px;height:28px;display:block}
.opt[aria-pressed="true"]{border-color:var(--bronze);background:var(--bronze-l);color:var(--bronze)}
.opt[aria-pressed="true"] svg .fill{fill:var(--bronze);fill-opacity:.16}
.opt[aria-pressed="true"] svg .ln{stroke:var(--bronze)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  border:1.5px solid var(--hair);background:#fff;border-radius:999px;padding:8px 14px;
  font-family:inherit;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;min-height:42px;
}
.chip[aria-pressed="true"]{border-color:var(--bronze);background:var(--bronze-l);color:var(--bronze)}
.chip .sw{display:inline-block;width:13px;height:13px;border-radius:50%;
  border:1px solid rgba(0,0,0,.25);vertical-align:-2px;margin-inline-end:6px}
.tog{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  border:1.5px solid var(--hair);border-radius:12px;padding:10px 13px;background:#fff;
  font-size:14.5px;font-weight:600;cursor:pointer;min-height:var(--tap);
}
.tog[aria-pressed="true"]{border-color:var(--bronze);background:var(--bronze-l);color:var(--bronze)}
.tog s{text-decoration:none;width:42px;height:25px;border-radius:999px;background:#DCE1E4;
  position:relative;flex:0 0 auto;transition:background .15s}
.tog s::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:19px;height:19px;
  border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:inset-inline-start .15s}
.tog[aria-pressed="true"] s{background:var(--bronze)}
.tog[aria-pressed="true"] s::after{inset-inline-start:20px}

/* ===== قائمة الفتحات ===== */
.opHead{display:flex;align-items:center;justify-content:space-between;gap:9px;margin-bottom:10px}
.opNo{background:var(--bronze);color:#fff;border-radius:9px;font-size:13px;font-weight:700;
  padding:4px 10px;flex:0 0 auto}
.opDel{border:1px solid var(--hair);background:#fff;border-radius:9px;color:var(--bad);
  font-family:inherit;font-size:13px;font-weight:600;padding:7px 12px;cursor:pointer;min-height:40px}
.opSum{font-size:12.5px;color:var(--soft);font-variant-numeric:tabular-nums;
  flex:1 1 auto;min-width:0;line-height:1.45}
.big{
  width:100%;border:0;border-radius:13px;background:var(--bronze);color:#fff;
  font-family:inherit;font-size:16.5px;font-weight:700;padding:15px;cursor:pointer;min-height:56px;
}
.big.ghost{background:#fff;color:var(--bronze);border:1.5px solid var(--bronze)}
.big:disabled{opacity:.45;cursor:default}
.note{font-size:12.5px;color:var(--soft);background:#EFF2F3;border-radius:10px;padding:9px 11px;line-height:1.8}
.warn{background:var(--bad-l);border:1px solid #E2C9C9;color:#8A2B2B;border-radius:10px;
  padding:9px 11px;font-size:13px;line-height:1.8;margin-bottom:10px}
.good{background:var(--ok-l);border:1px solid #BFDCC6;color:var(--ok);border-radius:10px;
  padding:9px 11px;font-size:13px;line-height:1.8;margin-bottom:10px}

/* ===== الشريط السفلي ===== */
.bar{
  position:fixed;inset-inline:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--hair);
  padding:9px 12px calc(9px + env(safe-area-inset-bottom));
  display:flex;gap:9px;align-items:center;
  box-shadow:0 -3px 14px rgba(0,0,0,.06);
}
.bar .cnt{flex:0 0 auto;font-size:12.5px;color:var(--soft);line-height:1.35;font-variant-numeric:tabular-nums}
.bar .cnt b{display:block;font-size:19px;color:var(--ink)}
.bar .big{flex:1}

/* ===== شاشة الإرسال ===== */
.sheet{position:fixed;inset:0;z-index:60;background:rgba(20,24,26,.55);display:none;
  align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet .inner{background:#fff;width:100%;max-width:640px;border-radius:18px 18px 0 0;
  padding:16px 14px calc(16px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.sheet h2{font-size:17px;margin:0 0 4px}
.sheet .code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;
  background:#F4F6F7;border:1px solid var(--hair);border-radius:10px;padding:9px;
  word-break:break-all;max-height:120px;overflow:auto;direction:ltr;text-align:left;line-height:1.5}
.qr{display:block;margin:10px auto;image-rendering:pixelated;width:min(280px,72vw);height:auto;
  border:8px solid #fff;background:#fff;border-radius:8px}
.hid{display:none!important}
</style>
</head>
<body>
<div id="app"></div>

<div class="bar" id="bar"></div>

<div class="sheet" id="sheet"><div class="inner" id="sheetIn"></div></div>

<script>
/* ==================================================================
   مقاسات النبراس — أداة الفني الميداني  ·  Nibras Field Measure
   ------------------------------------------------------------------
   أداة مستقلة تماماً عن المسعّر: لا تحتوي أي سعر ولا تكلفة، فالفني
   يرفع المقاسات فقط. تشتغل بدون إنترنت، وتحفظ تلقائياً بعد كل لمسة
   حتى لو أُغلق الجوال أو نام في منتصف المعاينة.

   النتيجة تُرسل كـ«رمز مقاسات» مضغوط عبر واتساب أو كملف، ويستقبله
   المسعّر فيفتح عميلاً جديداً ببنوده جاهزة.
   ================================================================== */
'use strict';

/* ================= اللغة ================= */
const L = {
ar:{
  dir:'rtl', lang:'ar', name:'عربي',
  appT:'مقاسات النبراس', appS:'أداة الفني الميداني',
  secJob:'بيانات العميل والموقع',
  cname:'اسم العميل', cphone:'رقم الجوال', ccity:'المدينة / الحي',
  caddr:'وصف الموقع', tech:'اسم الفني', jdate:'تاريخ المعاينة',
  gps:'تسجيل الموقع من الخريطة', gpsOn:'تم تسجيل الموقع', gpsErr:'تعذّر تحديد الموقع',
  secOps:'الفتحات', opN:'فتحة', addOp:'+ إضافة فتحة',
  room:'الغرفة / المكان', kind:'نوع الفتحة', leaves:'عدد الدرف',
  w:'العرض', h:'الارتفاع', q:'العدد', cm:'سم',
  color:'اللون', mesh:'سلك (منّة)', notes:'ملاحظات على هذه الفتحة',
  jnotes:'ملاحظات عامة على المشروع',
  del:'حذف', ops:'فتحة', send:'إرسال المقاسات',
  k_slide:'سحاب', k_swing:'مفصلي', k_flap:'قلاب', k_fixed:'ثابت', k_door:'باب',
  lv:'درفة', lv2:'درفتين', lv3:'٣ درف', lv4:'٤ درف', lv1:'فردة',
  c_white:'أبيض', c_black:'أسود', c_bronze:'برونزي',
  c_champagne:'شامبين', c_wood:'خشبي', c_grey:'رمادي',
  r_hall:'الصالة', r_majlis:'المجلس', r_kitchen:'المطبخ', r_bed:'غرفة نوم',
  r_bath:'دورة مياه', r_stair:'الدرج', r_roof:'السطح', r_other:'أخرى',
  needName:'اكتب اسم العميل قبل الإرسال.',
  needOps:'أضف فتحة واحدة على الأقل بمقاسات صحيحة.',
  badOp:'الفتحة رقم {n}: العرض والارتفاع لازم يكونان أكبر من صفر.',
  sendT:'إرسال المقاسات', sendS:'اختر طريقة الإرسال — كلها ترسل نفس الرمز.',
  wa:'إرسال بالواتساب', share:'مشاركة', file:'تنزيل ملف', copy:'نسخ الرمز',
  copied:'تم نسخ الرمز', close:'إغلاق',
  summ:'{o} فتحة · {p} قطعة · {a} م²',
  waMsg:'مقاسات {c} — {o} فتحة\nمن: {t}\n\nالرمز (الصقه في المسعّر):',
  longCode:'المعاينة كبيرة — أرسلها كملف عبر «مشاركة» أو «تنزيل ملف»، لأن رابط الواتساب قد يُقصّ عند هذا الطول.',
  clearT:'مسح الكل والبدء من جديد', clearC:'متأكد؟ سيُمسح كل ما أدخلته.',
  emptyOps:'ما فيه فتحات بعد. اضغط «إضافة فتحة».',
  reqW:'العرض', reqH:'الارتفاع'
},
en:{
  dir:'ltr', lang:'en', name:'EN',
  appT:'Nibras Measure', appS:'Field survey tool',
  secJob:'Customer & site',
  cname:'Customer name', cphone:'Mobile number', ccity:'City / district',
  caddr:'Site description', tech:'Technician name', jdate:'Survey date',
  gps:'Capture GPS location', gpsOn:'Location captured', gpsErr:'Could not get location',
  secOps:'Openings', opN:'Opening', addOp:'+ Add opening',
  room:'Room / location', kind:'Opening type', leaves:'Leaves',
  w:'Width', h:'Height', q:'Qty', cm:'cm',
  color:'Colour', mesh:'Insect mesh', notes:'Notes on this opening',
  jnotes:'General project notes',
  del:'Delete', ops:'openings', send:'Send measurements',
  k_slide:'Sliding', k_swing:'Casement', k_flap:'Top-hung', k_fixed:'Fixed', k_door:'Door',
  lv:'leaf', lv2:'2 leaves', lv3:'3 leaves', lv4:'4 leaves', lv1:'Single',
  c_white:'White', c_black:'Black', c_bronze:'Bronze',
  c_champagne:'Champagne', c_wood:'Wood', c_grey:'Grey',
  r_hall:'Hall', r_majlis:'Majlis', r_kitchen:'Kitchen', r_bed:'Bedroom',
  r_bath:'Bathroom', r_stair:'Stairs', r_roof:'Roof', r_other:'Other',
  needName:'Enter the customer name before sending.',
  needOps:'Add at least one opening with valid dimensions.',
  badOp:'Opening {n}: width and height must be greater than zero.',
  sendT:'Send measurements', sendS:'Pick any method — all send the same code.',
  wa:'Send on WhatsApp', share:'Share', file:'Download file', copy:'Copy code',
  copied:'Code copied', close:'Close',
  summ:'{o} openings · {p} units · {a} m²',
  waMsg:'Measurements for {c} — {o} openings\nBy: {t}\n\nCode (paste into the pricer):',
  longCode:'This survey is large — send it as a file via “Share” or “Download file”; a WhatsApp link this long can get truncated.',
  clearT:'Clear all and start over', clearC:'Are you sure? Everything entered will be erased.',
  emptyOps:'No openings yet. Tap “Add opening”.',
  reqW:'Width', reqH:'Height'
}};
let LANG = 'ar';
const T = k => (L[LANG][k] !== undefined ? L[LANG][k] : k);
const TF = (k,o)=>{ let s=T(k); for(const x in o) s=s.split('{'+x+'}').join(o[x]); return s; };

/* ================= النموذج ================= */
const KINDS = [
  {id:'slide', lv:[2,3,4],   dflt:2},
  {id:'swing', lv:[1,2],     dflt:2},
  {id:'flap',  lv:[1,2],     dflt:2},
  {id:'fixed', lv:[1],       dflt:1},
  {id:'door',  lv:[1,2],     dflt:1}
];
const COLORS = [
  {id:'white',hex:'#CDD4D8'},{id:'black',hex:'#1B1F22'},{id:'bronze',hex:'#7B5230'},
  {id:'champagne',hex:'#C6B08A'},{id:'wood',hex:'#8A5C33'},{id:'grey',hex:'#5C6469'}
];
const ROOMS = ['hall','majlis','kitchen','bed','bath','stair','roof','other'];

const KEY = 'nibras_field_v1';
const blankOp = ()=>({r:'', k:'slide', l:2, w:'', h:'', q:1, c:'white', m:0, n:''});
const blankJob= ()=>({c:'', p:'', city:'', addr:'', tech:'', d:today(), gps:'', n:''});
function today(){ const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

let S = load() || {job:blankJob(), ops:[blankOp()]};

function save(){ try{ localStorage.setItem(KEY, JSON.stringify({lang:LANG, job:S.job, ops:S.ops})); }catch(e){} }
function load(){
  try{
    const raw=localStorage.getItem(KEY); if(!raw) return null;
    const d=JSON.parse(raw); if(!d || !Array.isArray(d.ops)) return null;
    if(d.lang==='en'||d.lang==='ar') LANG=d.lang;
    return {job:Object.assign(blankJob(), d.job||{}), ops:d.ops.map(o=>Object.assign(blankOp(), o))};
  }catch(e){ return null; }
}

const n0 = v => { const x=parseFloat(v); return isFinite(x)?x:0; };
const esc = v => String(v==null?'':v).replace(/[&<>"']/g, c=>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function totals(){
  let pcs=0, m2=0, valid=0;
  S.ops.forEach(o=>{ const w=n0(o.w), h=n0(o.h), q=Math.max(0,Math.round(n0(o.q)));
    if(w>0&&h>0&&q>0){ valid++; pcs+=q; m2+=(w/100)*(h/100)*q; } });
  return {ops:valid, pcs, m2};
}

/* ================= الرموز ================= */
const ICON = {
  slide:`<svg viewBox="0 0 48 34"><rect class="fill ln" x="2" y="2" width="44" height="30" rx="2" fill="none" stroke="#5A666E" stroke-width="2"/><line class="ln" x1="24" y1="2" x2="24" y2="32" stroke="#5A666E" stroke-width="2"/><path class="ln" d="M9 17h9m0 0-3-3m3 3-3 3" stroke="#5A666E" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>`,
  swing:`<svg viewBox="0 0 48 34"><rect class="fill ln" x="2" y="2" width="44" height="30" rx="2" fill="none" stroke="#5A666E" stroke-width="2"/><line class="ln" x1="24" y1="2" x2="24" y2="32" stroke="#5A666E" stroke-width="2"/><path class="ln" d="M20 6 12 17l8 11M28 6l8 11-8 11" stroke="#5A666E" stroke-width="1.6" fill="none" stroke-linejoin="round"/></svg>`,
  flap:`<svg viewBox="0 0 48 34"><rect class="fill ln" x="2" y="2" width="44" height="30" rx="2" fill="none" stroke="#5A666E" stroke-width="2"/><path class="ln" d="M6 28 24 8l18 20" stroke="#5A666E" stroke-width="1.8" fill="none" stroke-linejoin="round"/></svg>`,
  fixed:`<svg viewBox="0 0 48 34"><rect class="fill ln" x="2" y="2" width="44" height="30" rx="2" fill="none" stroke="#5A666E" stroke-width="2"/><rect class="ln" x="9" y="8" width="30" height="18" rx="1" fill="none" stroke="#5A666E" stroke-width="1.4" stroke-dasharray="3 3"/></svg>`,
  door:`<svg viewBox="0 0 48 34"><rect class="fill ln" x="12" y="2" width="24" height="30" rx="2" fill="none" stroke="#5A666E" stroke-width="2"/><circle class="ln" cx="18" cy="18" r="1.8" fill="#5A666E" stroke="none"/></svg>`
};

/* ================= البناء ================= */
const el = (h)=>{ const d=document.createElement('div'); d.innerHTML=h.trim(); return d.firstChild; };

function fld(label, inner){ return `<div class="fld"><label class="f">${esc(label)}</label>${inner}</div>`; }
function inp(path, val, opt){
  opt=opt||{};
  return `<input data-b="${path}" value="${esc(val)}"`
    + (opt.type?` type="${opt.type}"`:'')
    + (opt.mode?` inputmode="${opt.mode}"`:'')
    + (opt.ph?` placeholder="${esc(opt.ph)}"`:'')
    + (opt.ac?` autocomplete="${opt.ac}"`:'')+'>';
}

function jobCard(){
  const j=S.job;
  return `<div class="eyebrow">${esc(T('secJob'))}</div><div class="card">`
    + fld(T('cname'), inp('job.c', j.c, {ac:'name'}))
    + `<div class="grid2">`
    +   fld(T('cphone'), inp('job.p', j.p, {mode:'tel', ac:'tel'}))
    +   fld(T('jdate'),  inp('job.d', j.d, {type:'date'}))
    + `</div>`
    + `<div class="grid2">`
    +   fld(T('ccity'), inp('job.city', j.city))
    +   fld(T('tech'),  inp('job.tech', j.tech))
    + `</div>`
    + fld(T('caddr'), inp('job.addr', j.addr))
    + `<button class="tog" id="gpsBtn" aria-pressed="${j.gps?'true':'false'}">`
    +   `<span>${esc(j.gps ? T('gpsOn') : T('gps'))}</span><s></s></button>`
    + `</div>`;
}

function opCard(o, i){
  const K=KINDS.find(k=>k.id===o.k)||KINDS[0];
  const w=n0(o.w), h=n0(o.h), q=Math.max(0,Math.round(n0(o.q)));
  const sum = (w>0&&h>0)
    ? `<bdi dir="ltr">${w}×${h}</bdi> ${esc(T('cm'))} · ${q} · <bdi dir="ltr">${((w/100)*(h/100)*q).toFixed(2)} m²</bdi>`
    : '—';
  return `<div class="card" data-op="${i}">`
    + `<div class="opHead"><span class="opNo">${esc(T('opN'))} ${i+1}</span>`
    +   `<span class="opSum">${sum}</span>`
    +   `<button class="opDel" data-del="${i}">${esc(T('del'))}</button></div>`

    + fld(T('room'), `<select data-b="ops.${i}.r">`
        + `<option value=""></option>`
        + ROOMS.map(r=>`<option value="${r}"${o.r===r?' selected':''}>${esc(T('r_'+r))}</option>`).join('')
        + (o.r && ROOMS.indexOf(o.r)<0 ? `<option value="${esc(o.r)}" selected>${esc(o.r)}</option>` : '')
        + `</select>`)

    + `<div class="fld"><label class="f">${esc(T('kind'))}</label><div class="opts">`
    + KINDS.map(k=>`<button class="opt" data-k="${i}|${k.id}" aria-pressed="${o.k===k.id?'true':'false'}">`
        + ICON[k.id] + `<span>${esc(T('k_'+k.id))}</span></button>`).join('')
    + `</div></div>`

    + (K.lv.length>1 ? `<div class="fld"><label class="f">${esc(T('leaves'))}</label><div class="chips">`
        + K.lv.map(n=>`<button class="chip" data-l="${i}|${n}" aria-pressed="${+o.l===n?'true':'false'}">`
            + esc(n===1 ? (o.k==='door'?T('lv1'):'1 '+T('lv')) : T('lv'+n)) + `</button>`).join('')
        + `</div></div>` : '')

    + `<div class="grid3">`
    +   fld(T('w')+' · '+T('cm'), inp(`ops.${i}.w`, o.w, {mode:'numeric', ph:T('reqW')}))
    +   fld(T('h')+' · '+T('cm'), inp(`ops.${i}.h`, o.h, {mode:'numeric', ph:T('reqH')}))
    +   fld(T('q'),               inp(`ops.${i}.q`, o.q, {mode:'numeric'}))
    + `</div>`

    + `<div class="fld"><label class="f">${esc(T('color'))}</label><div class="chips">`
    + COLORS.map(c=>`<button class="chip" data-c="${i}|${c.id}" aria-pressed="${o.c===c.id?'true':'false'}">`
        + `<span class="sw" style="background:${c.hex}"></span>${esc(T('c_'+c.id))}</button>`).join('')
    + `</div></div>`

    + (o.k==='slide' || o.k==='swing'
        ? `<div class="fld"><button class="tog" data-m="${i}" aria-pressed="${o.m?'true':'false'}">`
          + `<span>${esc(T('mesh'))}</span><s></s></button></div>` : '')

    + fld(T('notes'), `<textarea data-b="ops.${i}.n">${esc(o.n)}</textarea>`)
    + `</div>`;
}

function render(){
  const D=L[LANG];
  document.documentElement.lang=D.lang;
  document.documentElement.dir=D.dir;
  document.body.classList.toggle('ltr', D.dir==='ltr');
  document.title = D.appT + ' — ' + D.appS;

  let head=document.querySelector('header');
  if(!head){ head=el('<header></header>'); document.body.insertBefore(head, document.getElementById('app')); }
  head.innerHTML = `<div><h1>${esc(T('appT'))}<span class="sub">${esc(T('appS'))}</span></h1></div>`
    + `<div class="lang">`
    + `<button data-lang="ar" aria-pressed="${LANG==='ar'?'true':'false'}">عربي</button>`
    + `<button data-lang="en" aria-pressed="${LANG==='en'?'true':'false'}">EN</button></div>`;

  const app=document.getElementById('app');
  app.innerHTML = `<div class="wrap">`
    + jobCard()
    + `<div class="eyebrow">${esc(T('secOps'))}</div>`
    + (S.ops.length ? S.ops.map(opCard).join('')
                    : `<div class="card"><div class="note">${esc(T('emptyOps'))}</div></div>`)
    + `<button class="big ghost" id="addOp" style="margin-top:4px">${esc(T('addOp'))}</button>`
    + `<div class="eyebrow">${esc(T('jnotes'))}</div>`
    + `<div class="card"><textarea data-b="job.n">${esc(S.job.n)}</textarea></div>`
    + `<button class="big ghost" id="clearAll" style="margin:14px 0 4px;color:var(--bad);border-color:#E2C9C9">`
    +   esc(T('clearT')) + `</button>`
    + `</div>`;

  const t=totals();
  document.getElementById('bar').innerHTML =
      `<div class="cnt"><b>${t.ops}</b>${esc(T('ops'))}</div>`
    + `<button class="big" id="sendBtn"${t.ops?'':' disabled'}>${esc(T('send'))}</button>`;

  wire(); save();
}

/* ================= الربط ================= */
function setPath(path, val){
  const p=path.split('.');
  if(p[0]==='job'){ S.job[p[1]]=val; return; }
  if(p[0]==='ops'){ const o=S.ops[+p[1]]; if(o) o[p[2]]=val; }
}

function wire(){
  document.querySelectorAll('header [data-lang]').forEach(b=>{
    b.onclick=()=>{ LANG=b.dataset.lang; render(); window.scrollTo(0,0); };
  });

  /* الحقول النصية: نحدّث الحالة بلا إعادة رسم حتى لا يقفز المؤشر */
  document.querySelectorAll('[data-b]').forEach(f=>{
    f.oninput=()=>{ setPath(f.dataset.b, f.value); save(); refreshBar(f); };
    f.onchange=()=>{ setPath(f.dataset.b, f.value); save(); refreshBar(f); };
  });

  document.querySelectorAll('[data-k]').forEach(b=>{
    b.onclick=()=>{
      const [i,k]=b.dataset.k.split('|'); const o=S.ops[+i]; if(!o) return;
      o.k=k;
      const K=KINDS.find(x=>x.id===k);
      if(K && K.lv.indexOf(+o.l)<0) o.l=K.dflt;
      if(k!=='slide' && k!=='swing') o.m=0;
      render();
    };
  });
  document.querySelectorAll('[data-l]').forEach(b=>{
    b.onclick=()=>{ const [i,n]=b.dataset.l.split('|'); const o=S.ops[+i];
      if(o){ o.l=+n; render(); } };
  });
  document.querySelectorAll('[data-c]').forEach(b=>{
    b.onclick=()=>{ const [i,c]=b.dataset.c.split('|'); const o=S.ops[+i];
      if(o){ o.c=c; render(); } };
  });
  document.querySelectorAll('[data-m]').forEach(b=>{
    b.onclick=()=>{ const o=S.ops[+b.dataset.m]; if(o){ o.m=o.m?0:1; render(); } };
  });
  document.querySelectorAll('[data-del]').forEach(b=>{
    b.onclick=()=>{ S.ops.splice(+b.dataset.del,1); render(); };
  });

  const add=document.getElementById('addOp');
  if(add) add.onclick=()=>{
    const last=S.ops[S.ops.length-1];
    const o=blankOp();
    if(last){ o.k=last.k; o.l=last.l; o.c=last.c; o.m=last.m; }   /* يتبع آخر اختيار */
    S.ops.push(o); render();
    const cards=document.querySelectorAll('[data-op]');
    const el2=cards[cards.length-1];
    if(el2) el2.scrollIntoView({behavior:'smooth', block:'center'});
  };

  const clr=document.getElementById('clearAll');
  if(clr) clr.onclick=()=>{ if(confirm(T('clearC'))){ S={job:blankJob(), ops:[blankOp()]}; render(); window.scrollTo(0,0); } };

  const gps=document.getElementById('gpsBtn');
  if(gps) gps.onclick=()=>{
    if(S.job.gps){ S.job.gps=''; render(); return; }
    if(!navigator.geolocation){ alert(T('gpsErr')); return; }
    navigator.geolocation.getCurrentPosition(
      p=>{ S.job.gps = p.coords.latitude.toFixed(6)+','+p.coords.longitude.toFixed(6); render(); },
      ()=>alert(T('gpsErr')), {enableHighAccuracy:true, timeout:10000});
  };

  const sb=document.getElementById('sendBtn');
  if(sb) sb.onclick=openSend;
}

/* تحديث العدّاد وملخّص البطاقة دون إعادة رسم الحقل الجاري تعبئته */
function refreshBar(src){
  const t=totals();
  const cnt=document.querySelector('#bar .cnt');
  if(cnt) cnt.innerHTML=`<b>${t.ops}</b>${esc(T('ops'))}`;
  const btn=document.getElementById('sendBtn');
  if(btn) btn.disabled = !t.ops;
  const card = src && src.closest ? src.closest('[data-op]') : null;
  if(card){
    const i=+card.dataset.op, o=S.ops[i];
    const w=n0(o.w), h=n0(o.h), q=Math.max(0,Math.round(n0(o.q)));
    const s=card.querySelector('.opSum');
    if(s) s.innerHTML = (w>0&&h>0)
      ? `<bdi dir="ltr">${w}×${h}</bdi> ${esc(T('cm'))} · ${q} · <bdi dir="ltr">${((w/100)*(h/100)*q).toFixed(2)} m²</bdi>`
      : '—';
  }
}

/* ================= الترميز =================
   JSON مضغوط → deflate → base64url، مسبوقاً بعلامة النسخة.
   نتفادى base64 العادي لأن + و / و = تُكسر داخل روابط واتساب.

   الضغط مهم عملياً: معاينة فيلا بأربعين فتحة وملاحظة على كل واحدة
   تعطي ٩٬٦٠٠ حرف بلا ضغط — رابط واتساب بهذا الطول يُقصّ في بعض
   الأجهزة. مع deflate تنزل إلى ٧٠٠ حرف تقريباً. لو المتصفح لا يدعم
   CompressionStream نرجع للترميز الخام تلقائياً وتبقى الأداة تعمل. */
function bytes64u(b){
  let s=''; b.forEach(x=>s+=String.fromCharCode(x));
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function b64u(str){ return bytes64u(new TextEncoder().encode(str)); }

async function deflate(str){
  if(typeof CompressionStream==='undefined') return null;
  try{
    const cs=new CompressionStream('deflate-raw');
    const w=cs.writable.getWriter();
    w.write(new TextEncoder().encode(str)); w.close();
    return new Uint8Array(await new Response(cs.readable).arrayBuffer());
  }catch(e){ return null; }
}

async function encode(){
  const json=payload();
  const z=await deflate(json);
  if(z && z.length) return 'NBFZ1.' + bytes64u(z);
  return 'NBF1.' + b64u(json);
}

function payload(){
  const ops=S.ops.filter(o=>n0(o.w)>0 && n0(o.h)>0 && Math.round(n0(o.q))>0)
    .map(o=>{
      const x={k:o.k, l:+o.l||1, w:n0(o.w), h:n0(o.h), q:Math.max(1,Math.round(n0(o.q))), c:o.c};
      if(o.r) x.r=o.r;
      if(o.m) x.m=1;
      if(o.n && o.n.trim()) x.n=o.n.trim();
      return x;
    });
  const j=S.job, job={};
  ['c','p','city','addr','tech','d','gps','n'].forEach(k=>{ if(j[k] && String(j[k]).trim()) job[k]=String(j[k]).trim(); });
  return JSON.stringify({t:'nbf', v:1, job, op:ops});
}

/* ================= الإرسال ================= */
function validate(){
  if(!String(S.job.c||'').trim()) return T('needName');
  let bad=0, good=0;
  S.ops.forEach((o,i)=>{
    const w=n0(o.w), h=n0(o.h);
    if(!w && !h) return;                       /* فتحة فاضية تُتجاهل بصمت */
    if(w>0 && h>0) good++; else if(!bad) bad=i+1;
  });
  if(bad) return TF('badOp',{n:bad});
  if(!good) return T('needOps');
  return '';
}

async function openSend(){
  const err=validate();
  const t=totals();
  const code=await encode();
  const j=S.job;
  const msg=TF('waMsg',{c:j.c||'—', o:t.ops, t:j.tech||'—'})+'\n'+code;

  const inner=document.getElementById('sheetIn');
  inner.innerHTML =
      (err ? `<div class="warn">${esc(err)}</div>` : '')
    + `<h2>${esc(T('sendT'))}</h2>`
    + `<div class="note" style="margin-bottom:11px">${esc(T('sendS'))}<br>`
    +   esc(TF('summ',{o:t.ops, p:t.pcs, a:t.m2.toFixed(2)})) + `</div>`
    + (err ? '' : (waTooLong(msg, j)
        ? `<div class="note" style="margin-bottom:9px">${esc(T('longCode'))}</div>` : ''))
    + (err ? '' :
        (waTooLong(msg, j) ? ''
          : `<button class="big" id="sWa" style="margin-bottom:9px">${esc(T('wa'))}</button>`)
      + `<button class="big ghost" id="sShare" style="margin-bottom:9px">${esc(T('share'))}</button>`
      + `<button class="big ghost" id="sFile" style="margin-bottom:9px">${esc(T('file'))}</button>`
      + `<button class="big ghost" id="sCopy" style="margin-bottom:11px">${esc(T('copy'))}</button>`
      + `<div class="code" id="sCode">${esc(code)}</div>`)
    + `<button class="big ghost" id="sClose" style="margin-top:11px">${esc(T('close'))}</button>`;

  const sheet=document.getElementById('sheet');
  sheet.classList.add('on');
  document.getElementById('sClose').onclick=()=>sheet.classList.remove('on');
  sheet.onclick=e=>{ if(e.target===sheet) sheet.classList.remove('on'); };
  if(err) return;

  const fname = 'nibras-'+(j.c||'survey').replace(/[^\p{L}\p{N}]+/gu,'-').slice(0,40)+'-'+j.d+'.txt';

  const wa=document.getElementById('sWa');
  if(wa) wa.onclick=()=>{
    const to=String(j.p||'').replace(/\D/g,'');
    const num = to ? (to.startsWith('966') ? to : to.replace(/^0/,'966')) : '';
    window.open('https://wa.me/'+num+'?text='+encodeURIComponent(msg), '_blank');
  };
  document.getElementById('sShare').onclick=async ()=>{
    const file=new File([msg], fname, {type:'text/plain'});
    try{
      if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({files:[file], title:T('appT')});
      }else if(navigator.share){
        await navigator.share({title:T('appT'), text:msg});
      }else{ dl(msg, fname); }
    }catch(e){}
  };
  document.getElementById('sFile').onclick=()=>dl(msg, fname);
  document.getElementById('sCopy').onclick=async ()=>{
    try{ await navigator.clipboard.writeText(code); }
    catch(e){ const r=document.createRange(); r.selectNode(document.getElementById('sCode'));
      const s=getSelection(); s.removeAllRanges(); s.addRange(r); document.execCommand('copy'); s.removeAllRanges(); }
    const b=document.getElementById('sCopy'); const o=b.textContent;
    b.textContent=T('copied'); setTimeout(()=>b.textContent=o, 1600);
  };
}

/* رابط wa.me يُقصّ عند أطوال كبيرة على بعض الأجهزة — عندها نوجّه للملف */
function waTooLong(msg, j){
  const to=String(j.p||'').replace(/\D/g,'');
  const num = to ? (to.startsWith('966') ? to : to.replace(/^0/,'966')) : '';
  return ('https://wa.me/'+num+'?text='+encodeURIComponent(msg)).length > 6000;
}

function dl(text, name){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text], {type:'text/plain;charset=utf-8'}));
  a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 800);
}

window.__FIELD = {encode, payload, validate, totals, deflate, get S(){return S}, set S(v){S=v}, KINDS, COLORS,
                  get LANG(){return LANG}, set LANG(v){LANG=v}, render, b64u};

render();
</script>
